<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>TileBuild</title>

  <body>
    <link rel="stylesheet" href="./main.css" />
    <div class="main__bg">
      <header>
        <nav class="nav">
          <div class="container">
            <div class="nav__wrapper">
              <img class="nav__logo" src="./images/TileBuild.svg" alt="logo" />
              <ul class="nav__lists">

                </li>
                <li>

                <li>

            <img src="./images/img.png" alt="" />

      </div>

    <div style="display: flex; gap: 40px; margin: 50px">
      <div style="width: 300px; background: red; color: white; order: 2">1</div>
      <div
        style="
          width: 300px;
          background: red;
          color: white;
          flex: 2 5 500px;
          order: 2;
        "

        2

      <div style="width: 300px; background: red; color: white; order: 1">3</div>
